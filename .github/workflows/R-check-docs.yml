on:
  push:
    branches: [main, master]
  pull_request:

name: "Documentation check"

jobs:
  docs-check:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    container:
      image: rocker/verse:latest
    env:
      GITHUB_PAT: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - name: Configure git safe directory
        run: |
          git config --global --add safe.directory /__w/qnp/qnp

      - name: Install dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::roxygen2
          needs: roxygen2

      - name: Document
        run: roxygen2::roxygenise()
        shell: Rscript {0}

      - name: Check for changed files
        run: |
          git add --all
          changes=$(git diff-index HEAD --name-only -- man/ NAMESPACE)
          # A newer roxygen2 rewrites only the recorded version fields.
          # Ignore those two lines, and still fail on any other DESCRIPTION change.
          if ! git diff --cached --quiet -I'^(Config/roxygen2/version|RoxygenNote):' HEAD -- DESCRIPTION; then
            changes="$changes DESCRIPTION"
          fi
          if [ -n "$changes" ]; then
            echo "Changes found after documenting."
            git --no-pager diff
            echo "$changes"
            echo "Please update documentation."
            exit 1
          else
            echo "No changes found after documenting."
            exit 0
          fi
